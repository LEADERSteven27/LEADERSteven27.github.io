site_name: Genie Mountain
site_url: https://leadersteven27.github.io/
site_description: 个人课程笔记与知识库
repo_name: LEADERSteven27/LEADERSteven27.github.io
repo_url: https://github.com/LEADERSteven27/LEADERSteven27.github.io/
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 丁ayChou

nav:
  - 主页:
      - index.md
      - 贡献指南: contributing.md
      - 课程页面模板: template.md
      - 更新历史: changelog.md
  - 光电:
      - optoelectronics/index.md
  - 数学物理:
      - math_phys/index.md
  - 计算机:
      - computer_science/index.md
  - 经济学:
      - economics/index.md
  - 通识与杂项:
      - general/index.md
  - 关于:
      - about/index.md

theme:
  name: material
  language: zh
  icon:
    logo: material/notebook-outline
    repo: fontawesome/brands/github
    edit: material/pencil
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  font:
    text: Noto Serif SC
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式

plugins:
  - search:
      lang:
        - zh
        - en
  - heti:
      extra_skipped_class:
        - arithmatex

extra_css:
  - https://fonts.googleapis.com/css?family=Noto+Serif+SC:300,300i,400,400i,700,700i&display=fallback
  - https://unpkg.com/katex@0/dist/katex.min.css
  - stylesheets/custom.css

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 4
  - meta
  - def_list
  - attr_list
  - md_in_html
  - sane_lists
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

